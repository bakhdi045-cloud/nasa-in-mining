[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nasa-in-mining"
version = "0.2.0"
description = "NISAR observation of mining sites: polygon coherence-change case study, API and web interface"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Adam BAKHADI"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "rasterio>=1.3.9,<2",
  "pyproj>=3.6,<4",
  "h5py>=3.10,<4",
  "matplotlib>=3.8,<4",
  "pillow>=10,<14",
  "requests>=2.31,<3",
  "shapely>=2.0,<3",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
nasa-mining = "nasa_in_mining.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nasa_in_mining = ["palettes.json"]
