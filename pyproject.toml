[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nasa-in-mining"
version = "0.1.0"
description = "Independent NISAR processing tools for mining observations, extracted from NISAR Pulse"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Adam BAKHADI"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "rasterio>=1.3.9,<2",
  "pyproj>=3.6,<4",
  "h5py>=3.10,<4",
  "matplotlib>=3.8,<4",
  "pillow>=10,<14",
  "requests>=2.31,<3",
]

[project.scripts]
nasa-mining = "nasa_in_mining.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nasa_in_mining = ["palettes.json"]
